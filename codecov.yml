coverage:
  precision: 2
  round: down
  range: '70...95'
  status:
    project:
      default:
        target: 85%
        threshold: 2%
    patch:
      default:
        target: 70%
        threshold: 5%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit
      paths:
        - src/
    - name: integration
      paths:
        - src/

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        informational: true
  individual_components:
    - component_id: compiler
      name: folio/compiler
      paths: ['src/execution/compiler.ts', 'src/execution/extract.ts', 'src/execution/guards.ts']
    - component_id: execution
      name: folio/execution
      paths:
        [
          'src/node/index.ts',
          'src/execution/coordinator.ts',
          'src/execution/transaction.ts',
          'src/node/worker.ts'
        ]
    - component_id: host
      name: folio/host
      paths: ['src/node/host.ts', 'src/remote/index.ts']
    - component_id: managed
      name: folio/managed
      paths: ['src/managed/index.ts', 'src/remote/frames.ts']
    - component_id: support
      name: folio/support
      paths: ['src/memory/imports.ts', 'src/remote/values.ts']

ignore:
  - 'tests/**/*'
  - 'experiments/**/*'
  - 'scripts/**/*'
  - 'coverage/**/*'
  - 'dist/**/*'
  - 'vitest.config.ts'
