name: Build Project

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  pull_request:
    branches: [master, ver/*, feat/*, renovate/*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node with JSPI
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install clang and lld
        run: sudo apt-get install -y clang lld
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit Suite
        run: bun run test
      - name: Integration Suite on Local workerd
        run: bun run test:integration
      - name: Build the Library
        run: bun run build
      - name: Run the Example
        run: bun run example
      - name: Regenerate the Result Summaries
        run: bun scripts/analyze/run.ts && git diff --exit-code -- results

  live:
    name: Live Deploy on Free
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 30
    concurrency:
      group: folio-live-deploy
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node with JSPI
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install clang and lld
        run: sudo apt-get install -y clang lld
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Deploy, Measure and Tear Down
        env:
          FREE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FREE_CLOUDFLARE_ACCOUNT_ID }}
          FREE_CLOUDFLARE_API_TOKEN: ${{ secrets.FREE_CLOUDFLARE_API_TOKEN }}
        run: bun run test:e2e
      - name: Keep the Raw Run Records
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-runs
          path: experiments/*/runs/
          retention-days: 14
          if-no-files-found: ignore

  snapshot:
    name: Publish Snapshot
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node for npm
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Stamp the Version with the Commit
        id: stamp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SNAPSHOT="${VERSION}-${GITHUB_SHA::7}"
          npm version "$SNAPSHOT" --no-git-tag-version
          echo "version=$SNAPSHOT" >> "$GITHUB_OUTPUT"
      - name: Build
        run: bun run build
      - name: Point npm at GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gmitch215'
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public --tag snapshot --ignore-scripts
      - name: Snapshot to Job Summary
        if: always()
        env:
          SNAPSHOT: ${{ steps.stamp.outputs.version }}
        run: |
          echo "## Snapshot publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`@gmitch215/folio@${SNAPSHOT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registries: npm and GitHub Packages, tag \`snapshot\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Install: \`bun add @gmitch215/folio@${SNAPSHOT}\`" >> "$GITHUB_STEP_SUMMARY"
